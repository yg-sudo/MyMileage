name: Kotlin Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install ktlint
        run: curl -sSLO https://github.com/pinterest/ktlint/releases/download/0.41.0/ktlint && chmod a+x ktlint

      - name: Run ktlint Check
        id: ktlint_check
        continue-on-error: true
        # Added --disabled_rules=filename to ignore class/file mismatch errors
        run: ./ktlint --disabled_rules=filename

      - name: Run ktlint Format
        if: steps.ktlint_check.outcome == 'failure'
        # Added --disabled_rules=filename here as well so formatting doesn't crash on them
        run: ./ktlint -F --disabled_rules=filename

      - name: Commit and Push fixes
        if: steps.ktlint_check.outcome == 'failure'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: Apply Ktlint formatting fixes"
          branch: ${{ github.head_ref }}
