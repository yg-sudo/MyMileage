name: Release Build

on:
  push:
    tags: [ "v*" ]

jobs:
  release_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # --- [FIX START] ---
      - name: Make gradlew executable
        run: chmod +x gradlew
      # --- [FIX END] ---

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      
      - name: Install Fastlane
        run: gem install fastlane

      - name: Decode Keystore
        run: |
          echo "${{ secrets.APP_UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > app/my-upload-key.jks

      - name: Create Google Play Key
        run: echo "${{ secrets.GOOGLE_PLAY_JSON_KEY }}" > fastlane/api-key.json

      - name: Build Release (AAB & APK)
        env:
          APP_UPLOAD_KEYSTORE_FILE: "my-upload-key.jks"
          APP_UPLOAD_STORE_PASSWORD: ${{ secrets.APP_UPLOAD_STORE_PASSWORD }}
          APP_UPLOAD_KEY_ALIAS: ${{ secrets.APP_UPLOAD_KEY_ALIAS }}
          APP_UPLOAD_KEY_PASSWORD: ${{ secrets.APP_UPLOAD_KEY_PASSWORD }}
        run: fastlane build_release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
